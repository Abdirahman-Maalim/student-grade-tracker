apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-grade-tracker-gke
  namespace: argocd
  # Deleting this Application also deletes everything it deployed
  # (including the cloud load balancer) - needed for a clean teardown.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Abdirahman-Maalim/student-grade-tracker.git
    targetRevision: main
    path: k8s-gke              # Kustomize overlay: base k8s/ + GKE patches + registry images
  destination:
    server: https://kubernetes.default.svc
    namespace: grade-tracker
  syncPolicy:
    automated:
      prune: true              # resources removed from Git are removed from the cluster
      selfHeal: true           # manual kubectl changes are reverted to match Git
    syncOptions:
      - CreateNamespace=true
