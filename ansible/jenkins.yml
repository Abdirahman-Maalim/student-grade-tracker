---
- name: Configure the Jenkins CI server
  hosts: jenkins
  become: true

  vars:
    node_major: "22"
    registry_host: "us-central1-docker.pkg.dev"
    # The default mirror redirect sent us to a mirror that times out from GCP,
    # so plugins are downloaded straight from the Jenkins archive.
    jenkins_plugin_mirror: "https://archives.jenkins.io/plugins"
    jenkins_plugins:
      - workflow-aggregator   # Pipeline (runs the Jenkinsfile)
      - git
      - github                # webhook trigger
      - credentials-binding   # withCredentials
      - junit                 # test reports + trend
      - timestamper           # timestamps()
      - email-ext             # email notifications
      - pipeline-graph-view   # stage view

  tasks:
    # ---------- base system ----------
    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, git, acl, unattended-upgrades]
        state: present
        update_cache: true

    # ---------- Java (runs Jenkins itself) ----------
    - name: Install Java 21 runtime
      ansible.builtin.apt:
        name: openjdk-21-jre-headless
        state: present

    # ---------- Jenkins ----------
    - name: Add the Jenkins LTS repository
      ansible.builtin.deb822_repository:
        name: jenkins
        uris: https://pkg.jenkins.io/debian-stable
        suites: binary/
        signed_by: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    # ---------- Node.js (the pipeline's npm test) ----------
    - name: Add the NodeSource repository
      ansible.builtin.deb822_repository:
        name: nodesource
        uris: "https://deb.nodesource.com/node_{{ node_major }}.x"
        suites: nodistro
        components: main
        signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    # ---------- Docker (the pipeline's image builds) ----------
    - name: Install Docker and buildx
      ansible.builtin.apt:
        name: [docker.io, docker-buildx]
        state: present

    - name: Let the jenkins user run Docker
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true
      notify: Restart Jenkins

    # ---------- Google Cloud CLI (Artifact Registry login) ----------
    - name: Add the Google Cloud CLI repository
      ansible.builtin.deb822_repository:
        name: google-cloud-sdk
        uris: https://packages.cloud.google.com/apt
        suites: cloud-sdk
        components: main
        signed_by: https://packages.cloud.google.com/apt/doc/apt-key.gpg

    - name: Install the Google Cloud CLI
      ansible.builtin.apt:
        name: google-cloud-cli
        state: present
        update_cache: true

    - name: Configure Docker auth for Artifact Registry (as jenkins)
      ansible.builtin.command:
        cmd: gcloud auth configure-docker {{ registry_host }} --quiet
        creates: /var/lib/jenkins/.docker/config.json
      become_user: jenkins

    # ---------- Jenkins plugins (as code) ----------
    - name: Look up the latest plugin installation manager release
      ansible.builtin.uri:
        url: https://api.github.com/repos/jenkinsci/plugin-installation-manager-tool/releases/latest
        return_content: true
      register: pim_release

    - name: Download the plugin installation manager
      ansible.builtin.get_url:
        url: "{{ (pim_release.json.assets | selectattr('name', 'match', '^jenkins-plugin-manager-.*\\.jar$') | first).browser_download_url }}"
        dest: /opt/jenkins-plugin-manager.jar
        mode: "0644"

    - name: Write the plugin list
      ansible.builtin.copy:
        dest: /var/lib/jenkins/plugins.txt
        content: "{{ jenkins_plugins | join('\n') }}\n"
        owner: jenkins
        group: jenkins
        mode: "0644"
      register: plugin_list

    - name: Stop Jenkins while plugins change
      ansible.builtin.service:
        name: jenkins
        state: stopped
      when: plugin_list.changed

    - name: Install plugins and their dependencies from the archive
      ansible.builtin.command:
        cmd: >-
          java -jar /opt/jenkins-plugin-manager.jar
          --war /usr/share/java/jenkins.war
          --plugin-download-directory /var/lib/jenkins/plugins
          --plugin-file /var/lib/jenkins/plugins.txt
      environment:
        JENKINS_UC_DOWNLOAD_URL: "{{ jenkins_plugin_mirror }}"
      become_user: jenkins
      when: plugin_list.changed

    # ---------- services and hardening ----------
    - name: Make sure Docker and Jenkins run now and at boot
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [docker, jenkins]

    - name: Harden SSH (no root login, keys only)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
        mode: "0644"
      notify: Restart SSH

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

  handlers:
    - name: Restart Jenkins
      ansible.builtin.service:
        name: jenkins
        state: restarted

    - name: Restart SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
