apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: grade-tracker
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - >
              until nc -z postgres-service 5432;
              do echo "waiting for postgres-service:5432...";
              sleep 2; done
      containers:
        - name: backend
          image: abdirahmankhalif/grade-tracker-backend:0.1.0
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: grade-tracker-config
          env:
            - name: DB_PASSWORD
              value: "qoslaaye"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
