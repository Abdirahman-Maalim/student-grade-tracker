apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: grade-tracker
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # NOTE: this image runs nginx-unprivileged, which listens on
          # 8080 internally (not 80) - as per frontend-service.yaml targetPort.
          image:  abdirahmankhalif/grade-tracker-frontend:9.9.9-broken
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
