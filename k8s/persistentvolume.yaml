apiVersion: v1
kind: PersistentVolume
metadata:
  name: grade-tracker-postgres-pv
  labels:
    app: grade-tracker
    tier: database
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/grade-tracker/postgres
